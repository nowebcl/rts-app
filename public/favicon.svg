<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <clipPath id="rounded">
      <rect width="64" height="64" rx="14" />
    </clipPath>
  </defs>
  <g clip-path="url(#rounded)">
    <!-- Blue left side -->
    <rect width="64" height="64" fill="#0816FF" />
    <!-- Orange right side with diagonal split -->
    <polygon points="46,0 64,0 64,64 26,64" fill="#FE8003" />
    <!-- White diagonal separator -->
    <line x1="46" y1="0" x2="26" y2="64" stroke="#ffffff" stroke-width="2.5" />
    <!-- RST text -->
    <text x="32" y="42" font-family="'Barlow', 'Arial Black', sans-serif" font-size="22" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="-0.5">RST</text>
  </g>
</svg>